syntax = "proto2";

package apollo.loam_velodyne;

import "modules/common_msgs/basic_msgs/header.proto";
import "modules/common_msgs/localization_msgs/pose.proto";

message Odometry {
    optional apollo.common.Header header = 1;
    optional string child_frame_id = 2;
    optional PoseWithCovariance pose = 3;
    optional TwistWithCovariance twist = 4;
}

message PoseWithCovariance {
    optional apollo.localization.Pose pose = 1;
    repeated double covariance = 2;
}

message TwistWithCovariance {
    optional Twist twist = 1;
    repeated double covariance = 2;
}

message Twist {
    optional Vector3 linear = 1;
    optional Vector3 angular = 2;
}

message Vector3 {
    optional double x = 1;
    optional double y = 2;
    optional double z = 3;
}