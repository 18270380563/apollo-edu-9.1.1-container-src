syntax = "proto2";

package apollo.loam_velodyne;

import "modules/common_msgs/basic_msgs/header.proto";

message PointField {
    enum MessageFormat {
        INT8 = 1;
        UINT8 = 2;
        INT16 = 3;
        UINT16 = 4;
        INT32 = 5;
        UINT32 = 6;
        FLOAT32 = 7;
        FLOAT64 = 8;
    }
    optional string name = 1;
    optional uint32 offset = 2;
    optional uint32 datatype = 3;
    optional uint32 count = 4;
}

message PointCloud2 {
    optional apollo.common.Header header = 1;
    optional uint32 height = 2;
    optional uint32 width = 3;
    repeated PointField fields = 4;
    optional bool is_bigendian = 5;
    optional uint32 point_step = 6;
    optional uint32 row_step = 7;
    repeated uint32 data = 8;
    optional bool is_dense = 9;
}