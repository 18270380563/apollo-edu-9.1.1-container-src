syntax = "proto2";

package apollo.trafficlight;

import "modules/traffic_light_wj/proto/geometry.proto";
import "modules/traffic_light_wj/proto/commons.proto";

message MapData {
    required int32 msgCnt = 1;
    // Minute Of The Year
    optional int32 timeStamp = 2;
    repeated Node nodes = 3;
}

message Node {
    optional string name = 1;
    required NodeReferenceID id = 2;
    required Position3D refPos = 3;
    repeated Link inLinks = 4;
    // all the links enter this Node
    // ...
}


message Link {
    optional string name = 1;
    // this link is from upstreamNode to the Node it belongs to
    required NodeReferenceID upstreamNodeId = 2;
    // List all the speed limits
    repeated SpeedLimit speedLimits = 3;
    // units of 1 cm
    required int32 linkWidth = 4;
    repeated Position3D points = 5;
    repeated Lane lanes = 6;
    // Lanes belong to this link
    // ...
}

message SpeedLimit {
    enum SpeedLimitType {
        SPEED_LIMIT_UNKNOWN = 0; // Speed limit type not available
        MAX_SPEED_IN_SCHOOL_ZONE = 1; // Only sent when the limit is active
        MAX_SPEED_IN_SCHOOL_ZONE_WHEN_CHILDREN_PRESENT = 2; // Sent at any time
        MAX_SPEED_IN_CONSTRUCTION_ZONE = 3; // Used for work zones, incident zones, etc.
        // where a reduced speed is present
        VEHICLE_MIN_SPEED = 4;
        VEHICLE_MAX_SPEED = 5; // Regulatory speed limit for general traffic
        VEHICLE_NIGHT_MAX_SPEED = 6;
        TRUCK_MIN_SPEED = 7;
        TRUCK_MAX_SPEED = 8;
        TRUCK_NIGHT_MAX_SPEED = 9;
        VEHICLES_WITH_TRAILERS_MIN_SPEED = 10;
        VEHICLES_WITH_TRAILERS_MAX_SPEED = 11;
        VEHICLES_WITH_TRAILERS_NIGHT_MAX_SPEED = 12;
        // ... (other speed limit types)
    }
    required SpeedLimitType type = 1;
    required int64 speed = 2;
}

message Lane {
    required int32 laneID = 1;
}

