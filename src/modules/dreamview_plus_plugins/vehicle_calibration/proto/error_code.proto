syntax = "proto2";

package apollo.dreamview.vehicle_calibration;

// Error code enum for API's of map creator tool
enum ErrorCode {
  // No error, returns no success.
  OK = 0;
  
  // error code.
  INTERNAL_ERROR = 21000;
  MISSING_REQUEST_ID = 21001;
  MISSING_TASK_ID = 21002;
  SUBSCRIBE_GNSS_CHANNEL_FAILED = 21004;
  SUBSCRIBE_CHASSIS_CHANNEL_FAILED = 21005;
  UNSUBSCRIBE_GNSS_CHANNEL_FAILED = 21006;
  UNSUBSCRIBE_CHASSIS_CHANNEL_FAILED = 21007;
  COLLECT_CALIB_DATA_FAILED = 21008;
  SAVE_CALIB_DATA_FAILED = 21009;
  DEL_CALIB_DATA_FAILED = 21010;
  GET_CALIB_RESULT_FAILED = 21011;
  UPDATE_OUTPUT_EXTRINSIC_FILE_FAILED = 21012;
}
