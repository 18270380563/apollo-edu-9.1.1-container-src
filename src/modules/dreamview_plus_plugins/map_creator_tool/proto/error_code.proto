syntax = "proto2";

package apollo.dreamview.maptool;

// Error code enum for API's of map creator tool
enum ErrorCode {
  // No error, returns no success.
  OK = 0;
  // Map creator tool error code.
  MISSING_REQUEST_ID = 15000;
  RECORD_DATA_FAILED = 15001; // Dreamview failed to record bags.
  GET_MAP_LIST_FAILED = 15002;
  MAP_CREATOR_STARTUP_FAILED = 15003;
  MAP_CREATOR_BREAKUP_FAILED = 15004;
  MAP_EXPORT_FAILED = 15005;
  LOAD_EDITOR_MAP_FAILED = 15006;
  MAP_SAVE_FAILED = 15007;
  MAP_QUALITY_INSPECTION_FAILED = 15008;
  MAP_MODE_CHOOSE_FAILED = 15009;
  MAP_ACOUNT_LOGIN_FAILED = 15010;
  MAP_ACOUNT_AUTH_FAILED = 15011;
  MAP_RELEASE_FAILED = 15012;
  COLLECT_DIST_OUT_OF_RANGE = 15013;
  EDITOR_DIST_OUT_OF_RANGE = 15014;
  GET_GPS_ODOMETRT_FAILED = 15015;
  NO_INSTITUTION_SELECTED = 15016;
  FILE_REPEATED = 15017;
  STOP_MAPPING_FAILED = 15018;
  CAPTURE_TRAFFIC_DATA_FAILED = 15019;
  FIND_PROJECT_IMAGE_FAILED = 15020;
}
