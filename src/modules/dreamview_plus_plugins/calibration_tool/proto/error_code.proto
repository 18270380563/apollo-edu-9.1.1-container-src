syntax = "proto2";

package apollo.dreamview.calibration;

// Error code enum for API's of map creator tool
enum ErrorCode {
  // No error, returns no success.
  OK = 0;
  
  // error code.
  INTERNAL_ERROR = 16000;
  MISSING_REQUEST_ID = 16001;
  MISSING_TASK_ID = 16002;
  SUBSCRIBE_LIDAR_CHANNEL_FAILED = 16004;
  SUBSCRIBE_CAMERA_CHANNEL_FAILED = 16005;
  UNSUBSCRIBE_LIDAR_CHANNEL_FAILED = 16006;
  UNSUBSCRIBE_CAMERA_CHANNEL_FAILED = 16007;
  COLLECT_CAMERA_CALIB_DATA_FAILED = 16008;
  SAVE_CAMERA_CALIB_DATA_FAILED = 16009;
  DEL_CAMERA_CALIB_DATA_FAILED = 16010;
  CAMERA_CALIB_GET_RESULT_FAILED = 16011;
  UPDATE_OUTPUT_EXTRINSIC_FILE_FAILED = 16012;
  SELECT_CAMERA_FAILED = 16013;
  MISSING_LIDAR_LIST = 16014;
  CAMERA_POINTCLOUD_TIME_DIFF_TOO_LARGE = 16015;
  LIDAR_CALIB_FAILED = 16016;
}
