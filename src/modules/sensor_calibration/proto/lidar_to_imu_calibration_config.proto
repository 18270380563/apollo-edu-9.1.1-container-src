syntax = "proto2";
package apollo.sensor_calibration;
message Rotation {
  required double x = 1;
  required double y = 2;
  required double z = 3;
  required double w = 4;
}

message Translation {
  required double x = 1;
  required double y = 2;
  required double z = 3;
}

message Extrinsics {
  required Rotation rotation = 1;
  required Translation translation = 2;
}

message Lidar {
  required string name = 1;
  required string path = 2;
  required Extrinsics extrinsics = 3;
  optional bool is_bp = 4 [default = false];
}

message LidarToIMUCalibrationConfig {
  required string odometry_path = 1;
  repeated Lidar lidars_info = 2;
  required string result_path = 3;
  optional bool calib_height = 4 [default = false];
  optional string frame = 5;
}