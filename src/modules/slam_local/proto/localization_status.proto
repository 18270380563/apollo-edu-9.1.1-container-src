syntax = "proto2";

package apollo.slam_local;

message LocalizationStatus {
    enum LocalizationSource {
        SLAM = 0;
        RTK = 1;
    }
    enum LidarSlamQuality {
        SLAM_LOCAL_LIDAR_VERY_GOOD = 0;
        SLAM_LOCAL_LIDAR_GOOD = 1;
        SLAM_LOCAL_LIDAR_NOT_BAD = 2;
        SLAM_LOCAL_LIDAR_BAD = 3;
    }
    optional LocalizationSource localization_souce = 1;
    optional LidarSlamQuality lidar_slam_quality = 2;
    optional int64 iter_count_number = 3;
    optional bool pose_covariance_status = 4;
    optional int64 matched_lidar_points = 5;


    optional bool debug_status = 100;
    optional double debug_icp_score = 101;
    optional double debug_intensity_score = 102;
}
