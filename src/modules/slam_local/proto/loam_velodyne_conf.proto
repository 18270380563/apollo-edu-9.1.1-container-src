syntax = "proto2";

package apollo.slam_local;

message LoamVelodyneConf {
    optional float scan_period = 1;
    optional float io_ratio= 2;
    optional int32 max_iterations = 3;
    optional float delta_tabort = 4;
    optional float delta_rabort = 5;
    optional string project_name = 6;
    optional float min_vertical_angle = 7;
    optional float max_vertical_angle = 8;
    optional float n_scan_rings = 9;
    optional string pointCloudTopic = 10;
    optional string imuTopic = 11;
    optional string odomTopic = 12;
    optional string gpsTopic = 13;
    optional string lidarFrame = 14;
    optional string baselinkFrame = 15;
    optional string odometryFrame = 16;
    optional string mapFrame = 17;
    optional bool useImuHeadingInitialization = 18;
    optional bool useGpsElevation = 19;
    optional float gpsCovThreshold = 20;
    optional float poseCovThreshold = 21;
    optional bool savePCD = 22;
    optional string savePCDDirectory = 23;
    optional string sensor = 24;
    optional int32 N_SCAN = 25;
    optional int32 Horizon_SCAN = 26;
    optional int32 downsampleRate = 27;
    optional int32 point_filter_num = 28;
    optional float lidarMinRange = 29;
    optional float lidarMaxRange = 30;
    optional int32 imuType = 31;
    optional float imuRate = 32;
    optional float imuAccNoise = 33;
    optional float imuGyrNoise = 34;
    optional float imuAccBiasN = 35;
    optional float imuGyrBiasN = 36;
    optional float imuGravity = 37;
    optional float imuRPYWeight = 38;
    optional float mappingSurfLeafSize = 39;
    optional float z_tollerance = 40;
    optional float rotation_tollerance = 41;
    optional int32 numberOfCores = 42;
    optional double mappingProcessInterval = 43;
    optional float surroundingkeyframeAddingDistThreshold = 44;
    optional float surroundingkeyframeAddingAngleThreshold = 45;
    optional float surroundingKeyframeDensity = 46;
    optional float surroundingKeyframeSearchRadius = 47;
    optional float surroundingKeyframeMapLeafSize = 48;
    optional bool loopClosureEnableFlag = 49;
    optional float loopClosureFrequency = 50;
    optional int32 surroundingKeyframeSize = 51;
    optional float historyKeyframeSearchRadius = 52;
    optional float historyKeyframeSearchTimeDiff = 53;
    optional int32 historyKeyframeSearchNum = 54;
    optional float loopClosureICPSurfLeafSize = 55;
    optional float historyKeyframeFitnessScore = 56;
    optional float globalMapVisualizationSearchRadius = 57;
    optional float globalMapVisualizationPoseDensity = 58;
    optional float globalMapVisualizationLeafSize = 59;
    optional string imuframe = 60;
}
